server:
  port: 8080

spring:
  application:
    name: smartpark-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:smartpark}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:smartpark-notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:smartpark_default_dev_secret_key_at_least_256_bits_for_hmac_sha256_security!}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15

smartpark:
  booking:
    cancellation-cutoff-minutes: 15
    expiry-check-interval-ms: 60000
    expiry-scheduler:
      enabled: true
  cache:
    enabled: ${CACHE_ENABLED:true}
    parking-lot-ttl-seconds: ${CACHE_PARKING_LOT_TTL:300}
    parking-slot-ttl-seconds: ${CACHE_PARKING_SLOT_TTL:120}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    authenticated-limit: ${RATE_LIMIT_AUTH_LIMIT:500}
    unauthenticated-limit: ${RATE_LIMIT_UNAUTH_LIMIT:200}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
  kafka:
    topics:
      booking-events: ${KAFKA_TOPIC_BOOKINGS:smartpark.booking.events}
      booking-events-dlt: ${KAFKA_TOPIC_BOOKINGS_DLT:smartpark.booking.events.DLT}
    consumer-group: ${KAFKA_CONSUMER_GROUP:smartpark-notification-group}
    outbox:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}


